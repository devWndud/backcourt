<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>빽코트 홍보 포스터</title>
    <link rel="stylesheet" href="./styles.css?v=14" />
  </head>
  <body>
    <header class="studio-header">
      <div>
        <p>BACKCOURT / SOCIAL</p>
        <h1>인스타 홍보 포스터</h1>
      </div>
      <div class="header-actions">
        <span>HTML · 1080 × 1080</span>
        <a href="./exports/backcourt-instagram-01.png" download>PNG 저장</a>
      </div>
    </header>

    <main class="board">
      <article class="creative">
        <div class="creative-meta"><b>01</b><span>브랜드 · 출시 예정</span></div>
        <div class="poster-shell">
          <section class="poster" aria-label="빽코트 출시 예정 홍보 포스터">
            <div class="back-type" aria-hidden="true"><span>BACK</span><span>COURT</span></div>
            <div class="platform">IOS / ANDROID</div>

            <div class="copy">
              <p class="kicker">농구할 땐</p>
              <div class="title-row">
                <h2>빽코트</h2>
                <p class="title-slogan">일상에서,<br /><strong>다시 코트로.</strong></p>
              </div>
              <i aria-hidden="true"></i>
              <div class="launch">
                <div class="store-marks" aria-label="Google Play 및 App Store">
                  <img class="google-play-logo" src="./assets/google-play-logo.svg" alt="Google Play" />
                  <img class="apple-logo" src="./assets/apple-logo.svg" alt="Apple" />
                </div>
                <strong>출시 예정</strong>
              </div>
            </div>

            <img class="hero-icon" src="./assets/app-icon.png" alt="빽코트 앱 아이콘" />
            <div class="court-lines" aria-hidden="true"><i></i><b></b></div>
          </section>
        </div>
        <a class="download" href="./exports/backcourt-instagram-01.png" download>PNG 저장</a>
      </article>
    </main>

    <footer>HTML과 CSS에서 문구 · 위치 · 색상을 바로 수정</footer>
    <script src="./poster.js?v=1"></script>
  </body>
</html>
