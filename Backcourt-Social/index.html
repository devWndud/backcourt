<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>빽코트 홍보 포스터</title>
    <link rel="stylesheet" href="./styles.css?v=8" />
  </head>
  <body>
    <header class="studio-header">
      <div>
        <p>BACKCOURT / SOCIAL</p>
        <h1>인스타 홍보 포스터</h1>
      </div>
      <div class="header-actions">
        <span>HTML · 1080 × 1080</span>
        <a href="./exports/backcourt-instagram-01.png" download>PNG 저장</a>
      </div>
    </header>

    <main class="board">
      <article class="creative">
        <div class="creative-meta"><b>01</b><span>브랜드 · 출시 예정</span></div>
        <div class="poster-shell">
          <section class="poster" aria-label="빽코트 출시 예정 홍보 포스터">
            <div class="back-type" aria-hidden="true"><span>BACK</span><span>COURT</span></div>
            <div class="platform">IOS / ANDROID</div>

            <div class="copy">
              <p>농구할 땐</p>
              <h2>빽코트</h2>
              <i aria-hidden="true"></i>
              <div class="launch">
                <div class="store-marks" aria-label="Google Play 및 App Store">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.7 2.4 14 12 3.7 21.6A2.6 2.6 0 0 1 3 19.8V4.2c0-.7.3-1.3.7-1.8Zm11.6 10.8 2.7 2.5L6.2 22.2l9.1-9Zm3.9-3.6c.6.3 1 .9 1 1.5s-.4 1.2-1 1.5l-2 1.1-2.9-2.7 2.9-2.7 2 1.3ZM6.2 1.8 18 8.3l-2.7 2.5-9.1-9Z" /></svg>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.8 12.8c0-2.6 2.1-3.8 2.2-3.9a4.7 4.7 0 0 0-3.7-2c-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.3-.8A4.9 4.9 0 0 0 4 9.5c-1.8 3-.5 7.5 1.2 10 .8 1.2 1.8 2.5 3.1 2.4 1.2-.1 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4a10.7 10.7 0 0 0 1.4-2.9 4.4 4.4 0 0 1-2.3-3.8ZM14.3 5.3A4.5 4.5 0 0 0 15.4 2a4.6 4.6 0 0 0-3 1.6 4.2 4.2 0 0 0-1.1 3.2 3.8 3.8 0 0 0 3-1.5Z" /></svg>
                </div>
                <strong>출시 예정</strong>
              </div>
            </div>

            <img class="hero-icon" src="./assets/app-icon.png" alt="빽코트 앱 아이콘" />
            <div class="court-lines" aria-hidden="true"><i></i><b></b></div>
          </section>
        </div>
        <a class="download" href="./exports/backcourt-instagram-01.png" download>PNG 저장</a>
      </article>
    </main>

    <footer>HTML과 CSS에서 문구 · 위치 · 색상을 바로 수정</footer>
    <script src="./poster.js?v=1"></script>
  </body>
</html>
