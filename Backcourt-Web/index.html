  <head>

  <body>
    <main class="poster">
      <section class="copy-panel">
        <header>
          <a class="brand" href="/" aria-label="빽코트 홈">
            <img src="./assets/brand-mark-on-light.png" alt="" />
            <strong>빽코트</strong>

          <span class="edition">KR · 2026</span>
        </header>

        <img class="ghost-ball" src="./assets/basketball-outline.png?v=1" alt="" aria-hidden="true" />

        <div class="hero-copy">
          <p class="kicker">농구할 땐</p>
          <h1>일상에서<br /><span>다시, 코트로.</span></h1>
          <div class="rule" aria-hidden="true"></div>
          <p class="subcopy">코트 찾기 · LIVE · 약속 · 기록</p>

          <div class="store-buttons" aria-label="앱 다운로드">

              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.7 2.4 14 12 3.7 21.6a2.6 2.6 0 0 1-.7-1.8V4.2c0-.7.3-1.3.7-1.8Zm11.6 10.8 2.7 2.5L6.2 22.2l9.1-9Zm3.9-3.6c.6.3 1 .9 1 1.5s-.4 1.2-1 1.5l-2 1.1-2.9-2.7 2.9-2.7 2 1.3ZM6.2 1.8 18 8.3l-2.7 2.5-9.1-9Z"/></svg>
              <span><small>GET IT ON</small>Google Play</span>
            </button>
            <button class="store-button" type="button" data-store="App Store">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.8 12.8c0-2.6 2.1-3.8 2.2-3.9a4.7 4.7 0 0 0-3.7-2c-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.3-.8a4.9 4.9 0 0 0-4.1 2.5c-1.8 3-.5 7.5 1.2 10 .8 1.2 1.8 2.5 3.1 2.4 1.2-.1 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4a10.7 10.7 0 0 0 1.4-2.9 4.4 4.4 0 0 1-2.3-3.8ZM14.3 5.3A4.5 4.5 0 0 0 15.4 2a4.6 4.6 0 0 0-3 1.6 4.2 4.2 0 0 0-1.1 3.2 3.8 3.8 0 0 0 3-1.5Z"/></svg>
              <span><small>Download on the</small>App Store</span>
            </button>
          </div>
        </div>

        <footer><span>BACKCOURT</span><span>© 2026</span></footer>
      </section>

      <section class="visual-panel" aria-label="빽코트">
        <span class="visual-meta">IOS / ANDROID</span>
        <p class="visual-word" aria-hidden="true">BACK<br />COURT</p>
        <div class="mark-wrap"><img src="./assets/icon.png?v=3" alt="빽코트" /></div>
        <span class="visual-caption">FIND YOUR COURT</span>
        <div class="court-markings" aria-hidden="true"><i></i><b></b></div>
      </section>
    </main>
    <div id="store-toast" class="store-toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=1"></script>
