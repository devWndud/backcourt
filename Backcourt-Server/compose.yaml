services:
  backcourt:
    build:
      context: ..
      dockerfile: Backcourt-Server/Dockerfile
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      ADMIN_STATIC_DIR: /app/admin
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH}:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
