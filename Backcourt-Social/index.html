<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>빽코트 소셜 스튜디오</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="studio-header">
      <div>
        <p>BACKCOURT / SOCIAL</p>
        <h1>인스타 피드 초안</h1>
      </div>
      <div class="header-actions">
        <span>1080 × 1080</span>
        <button id="download-all" type="button">5장 저장</button>
      </div>
    </header>

    <main class="board">
      <article class="creative">
        <div class="creative-meta"><b>01</b><span>브랜드</span></div>
        <div class="canvas-shell"><canvas id="slide-1" width="1080" height="1080"></canvas></div>
        <button class="download" type="button" data-slide="1">PNG 저장</button>
      </article>

      <article class="creative">
        <div class="creative-meta"><b>02</b><span>코트 찾기</span></div>
        <div class="canvas-shell"><canvas id="slide-2" width="1080" height="1080"></canvas></div>
        <button class="download" type="button" data-slide="2">PNG 저장</button>
      </article>

      <article class="creative">
        <div class="creative-meta"><b>03</b><span>LIVE · 약속</span></div>
        <div class="canvas-shell"><canvas id="slide-3" width="1080" height="1080"></canvas></div>
        <button class="download" type="button" data-slide="3">PNG 저장</button>
      </article>

      <article class="creative">
        <div class="creative-meta"><b>04</b><span>출석 · 랭킹</span></div>
        <div class="canvas-shell"><canvas id="slide-4" width="1080" height="1080"></canvas></div>
        <button class="download" type="button" data-slide="4">PNG 저장</button>
      </article>

      <article class="creative">
        <div class="creative-meta"><b>05</b><span>피드 · 프로필</span></div>
        <div class="canvas-shell"><canvas id="slide-5" width="1080" height="1080"></canvas></div>
        <button class="download" type="button" data-slide="5">PNG 저장</button>
      </article>
    </main>

    <footer>문구 · 배치 · 색은 화면 보면서 바로 수정</footer>
    <script src="./app.js?v=2"></script>
  </body>
</html>
