# Catch requests whose Host does not match any configured site.
# Without this explicit default, Nginx serves the first loaded virtual host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/backcourt.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/backcourt.kro.kr/privkey.pem;

    return 444;
}
