<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>빽코트 인스타 3분할 그리드</title>
    <link rel="stylesheet" href="./triptych.css?v=1" />
  </head>
  <body>
    <header class="studio-header">
      <div><p>BACKCOURT / SOCIAL</p><h1>인스타 3분할 그리드</h1></div>
      <div class="header-actions"><span>3240 × 1440 · 3:4 GRID</span><a href="#downloads">저장 순서</a></div>
    </header>

    <main class="board">
      <div class="meta"><b>01—03</b><span>인스타 3:4 프로필 그리드 연결 포스터</span></div>
      <div class="triptych-shell">
        <section class="triptych" aria-label="빽코트 인스타그램 연결 포스터">
          <div class="mega-type" aria-hidden="true"><span>BACK</span><span>COURT</span></div>
          <div class="platform">IOS / ANDROID</div>
          <div class="edition">BACKCOURT · 2026</div>

          <div class="panel-number p1">01 / 03</div>
          <div class="panel-number p2">02 / 03</div>
          <div class="panel-number p3">03 / 03</div>

          <div class="left-copy">
            <p>농구할 땐</p>
            <h2>빽코트</h2>
            <i aria-hidden="true"></i>
            <span>BACK TO THE COURT</span>
          </div>

          <img class="hero-icon" src="./assets/app-icon.png" alt="빽코트 앱 아이콘" />

          <div class="right-copy">
            <p>일상에서,</p>
            <h2>다시<br />코트로.</h2>
            <div class="launch">
              <img src="./assets/google-play-logo.svg" alt="Google Play" />
              <img class="apple-logo" src="./assets/apple-logo.svg" alt="Apple" />
              <i aria-hidden="true"></i>
              <strong>출시 예정</strong>
            </div>
          </div>

          <div class="court-lines" aria-hidden="true"><i></i><b></b><em></em></div>
          <div class="baseline" aria-hidden="true"></div>
          <div class="grid-guides" aria-hidden="true"><i></i><b></b></div>
        </section>
      </div>

      <div class="downloads" id="downloads">
        <p>업로드는 오른쪽 → 가운데 → 왼쪽 순서</p>
        <a href="./exports/backcourt-grid-upload-01-right.png" download>1. 오른쪽</a>
        <a href="./exports/backcourt-grid-upload-02-center.png" download>2. 가운데</a>
        <a href="./exports/backcourt-grid-upload-03-left.png" download>3. 왼쪽</a>
      </div>
    </main>
    <script src="./triptych.js?v=1"></script>
  </body>
</html>
