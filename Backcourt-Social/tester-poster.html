<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <title>빽코트 안드로이드 테스터 모집</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1080px; height: 1440px; margin: 0; overflow: hidden; }
      body { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .poster {
        position: relative;
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        color: #090909;
        background: #ff613f;
      }
      .back-type {
        position: absolute;
        top: -8px;
        right: 48px;
        margin: 0;
        color: rgba(112, 28, 9, .18);
        font: 900 174px/.82 "Arial Black", Arial, sans-serif;
        letter-spacing: -13px;
        text-align: right;
      }
      .meta {
        position: absolute;
        z-index: 3;
        top: 62px;
        left: 72px;
        color: #fffaf4;
        font: 900 20px Arial, sans-serif;
        letter-spacing: 6px;
      }
      .title {
        position: absolute;
        z-index: 3;
        top: 290px;
        left: 68px;
      }
      .title p {
        margin: 0 0 22px;
        color: #781f0b;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 5px;
      }
      h1 {
        margin: 0;
        color: #fffaf4;
        font-size: 104px;
        line-height: .94;
        font-weight: 950;
        letter-spacing: -8px;
      }
      h1 span { color: #090909; }
      .icon {
        position: absolute;
        z-index: 2;
        top: 316px;
        right: 46px;
        width: 436px;
        height: 436px;
        object-fit: contain;
        filter: drop-shadow(28px 32px 0 rgba(113, 30, 11, .28));
      }
      .copy {
        position: absolute;
        z-index: 3;
        top: 742px;
        left: 72px;
        margin: 0;
        color: #fffaf4;
        font-size: 35px;
        line-height: 1.38;
        font-weight: 900;
        letter-spacing: -2px;
      }
      .features {
        position: absolute;
        z-index: 3;
        top: 858px;
        left: 72px;
        display: flex;
        gap: 12px;
      }
      .features span {
        padding: 12px 18px 11px;
        color: #fffaf4;
        border: 3px solid rgba(255, 250, 244, .82);
        font-size: 19px;
        font-weight: 900;
      }
      .join {
        position: absolute;
        z-index: 4;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 440px;
        color: #fff;
        background: #090909;
      }
      .join-copy { position: absolute; left: 72px; top: 67px; }
      .android {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 28px;
        color: #ff613f;
        font: 900 19px Arial, sans-serif;
        letter-spacing: 5px;
      }
      .android img { width: 27px; height: 30px; object-fit: contain; }
      .join h2 {
        margin: 0;
        color: #fffaf4;
        font-size: 59px;
        line-height: 1.03;
        letter-spacing: -5px;
      }
      .join h2 span { color: #ff613f; }
      .join small {
        display: block;
        margin-top: 25px;
        color: #a9a9a9;
        font-size: 20px;
        font-weight: 800;
      }
      .qr-card {
        position: absolute;
        top: 49px;
        right: 70px;
        width: 318px;
        height: 318px;
        display: grid;
        place-items: center;
        background: #fff;
      }
      .qr-card img { width: 256px; height: 256px; image-rendering: pixelated; }
      .foot {
        position: absolute;
        left: 72px;
        bottom: 30px;
        color: #686868;
        font: 900 14px Arial, sans-serif;
        letter-spacing: 4px;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <p class="back-type" aria-hidden="true">BACK<br />COURT</p>
      <span class="meta">ANDROID / CLOSED TEST</span>

      <section class="title">
        <p>BACK TO THE COURT</p>
        <h1>빽코트<br /><span>테스터 모집</span></h1>
      </section>

      <img class="icon" src="./assets/app-icon.png" alt="" />

      <p class="copy">14일 동안 먼저 써보고,<br />불편한 점만 알려주세요.</p>
      <div class="features" aria-label="주요 기능">
        <span>코트 찾기</span><span>LIVE</span><span>약속</span><span>GPS 출석</span>
      </div>

      <section class="join">
        <div class="join-copy">
          <div class="android">
            <img src="./assets/google-play-logo.svg" alt="" />
            <span>ANDROID ONLY</span>
          </div>
          <h2>QR 찍고<br /><span>테스트 참여</span></h2>
          <small>참여 후 Google Play에서 설치</small>
        </div>
        <div class="qr-card">
          <img src="./assets/tester-qr.png" alt="비공개 테스트 참여 QR 코드" />
        </div>
        <span class="foot">BACKCOURT / 2026</span>
      </section>
    </main>
  </body>
</html>
